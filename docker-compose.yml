services:
  mysql:
    image: mysql:8.0
    container_name: agenthub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agenthub
      MYSQL_USER: agenthub
      MYSQL_PASSWORD: agenthub123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - agenthub-network

volumes:
  mysql_data:

networks:
  agenthub-network:
    name: agenthub_network
    driver: bridge
